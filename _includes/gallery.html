{% assign photos = site.data.gallery %}
{% if photos and photos.size > 0 %}
<section class="gallery" aria-label="Photo carousel">
  <div class="carousel" data-carousel style="--n: {{ photos.size }}">
    <div class="carousel-stage">
      <div class="carousel-ring">
        {% for ph in photos %}
        <figure class="slide" style="--k: {{ forloop.index0 }}" data-index="{{ forloop.index0 }}">
          <img src="{{ ph.src | relative_url }}" alt="{{ ph.caption }}" loading="lazy" draggable="false">
          {% if ph.caption %}<figcaption class="mono">{{ ph.caption }}</figcaption>{% endif %}
        </figure>
        {% endfor %}
      </div>
    </div>
    <div class="carousel-floor">{% include scenes/pushers.html %}</div>
    <div class="carousel-controls">
      <button class="carousel-btn" data-dir="-1" aria-label="Previous photo"><span aria-hidden="true">←</span></button>
      <p class="mono carousel-hint">drag, or tap the arrows to push</p>
      <button class="carousel-btn" data-dir="1" aria-label="Next photo"><span aria-hidden="true">→</span></button>
    </div>
  </div>
</section>
{% endif %}
