{% assign projects = site.projects | sort: "order" %}
<div class="cards">
  {% for p in projects %}
  <a class="card" href="{{ p.url | relative_url }}" style="--i: {{ forloop.index }}">
    <p class="mono card-meta"><span>{{ p.year }}</span><span class="card-go" aria-hidden="true">→</span></p>
    <p class="card-title">{{ p.title }}</p>
    {% if p.summary %}<p class="card-body">{{ p.summary }}</p>{% endif %}
    {% if p.tags %}<div class="tags">{% for t in p.tags %}<span class="tag">{{ t }}</span>{% endfor %}</div>{% endif %}
    <span class="card-more mono">Read more</span>
  </a>
  {% endfor %}
</div>
