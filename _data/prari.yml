roadmap:
  - when: "Now"
    title: "Validation"
    text: "Use case defined, prototype designed in CAD, 22 farmer interviews, $5,000 paid pilot agreed."
  - when: "Months 1–3"
    title: "Prototype"
    text: "Build one rover (~$5.1K in parts) with nitrate, pH and moisture sensing; test RTK navigation."
  - when: "Months 3–6"
    title: "Pilot"
    text: "South Mountain pilot: 3 site visits, 70 lab tests to validate rover readings."
  - when: "Months 6–12"
    title: "First contracts"
    text: "Convert the pilot to a service contract; add solar dock and lidar; sign 3–5 Southeast row-crop farms; scope the UCD pasture pilot."
