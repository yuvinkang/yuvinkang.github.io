problem_stats:
  - value: 46
    pre: "Only "
    suf: "%"
    text: "of nitrogen added to cropland reaches the harvest worldwide"
  - value: 273
    suf: "×"
    text: "more potent than CO₂: the nitrous oxide inefficient fertilizing releases"
