# PRARI ROBOTICS — content for the project page (/projects/prari-rover/).
# A design showcase: the rover, its CAD, its modules, and the research behind it. Edit freely.

tagline: "Modular field rover for ground-level soil and crop data."
chips: ["Co-founded at Yale · 2026", "Designed in SolidWorks", "Sobotka Seed Prize proposal"]

idea: "Fields vary patch by patch, but most get one soil test and one fertilizer plan. Prari is an autonomous rover that drives the rows and measures soil directly, under the canopy where drones cannot see."

team: ["Tony Gao", "Hunter Yang"]

# Design highlights shown next to the drag-to-turn renders
design:
  - title: "Modular by design"
    text: "One base rover with swappable side-bay modules, so one platform serves every crop and season."
  - title: "Built for the rows"
    text: "High-clearance chassis and wide, deep-tread tires to straddle crop rows on uneven ground."
  - title: "Sensing up front"
    text: "Front camera window and top sensor housing for navigation and crop views; soil probe deploys at each stop."

modules:
  - name: "Soil probe"
    short: "Soil conditions and sampling"
    detail: "A linear actuator pushes moisture, pH and nitrate sensors into the ground at every stop."
    x: 24.6
    y: 25.9
  - name: "Regrowth scanner"
    short: "Pasture height and recovery"
    detail: "Tracks how pasture grows back between grazing rotations."
    x: 59.9
    y: 24.5
  - name: "Imaging module"
    short: "Crop and ripeness views"
    detail: "Depth camera while driving for crop vigor, stand count and canopy stress."
    x: 69.0
    y: 28.2
  - name: "Base rover"
    short: "Drive, power, and navigation"
    detail: "RTK GPS for centimeter-level navigation, a depth camera for rows and obstacles, and a 24 V battery."
    x: 67.9
    y: 49.2
  - name: "Extended battery"
    short: "More range on large farms"
    detail: "Bolt-on capacity for longer days in bigger fields."
    x: 35.1
    y: 63.2
  - name: "Spectral sensor"
    short: "Plant health and stress"
    detail: "Reads plant stress before it's visible, under the canopy."
    x: 45.6
    y: 68.5

# The research side: what the rover measures, chosen from farmer conversations
measures:
  - name: "Labile carbon"
    note: "Active carbon available to microbes; responds faster than total organic carbon."
  - name: "Soil pH"
    note: "Controls nutrient availability. Ion-selective electrode at each probe stop."
  - name: "Nitrogen"
    note: "Nitrate readings, with loss risk flagged after heavy rain."
  - name: "Phosphorus"
    note: "Rover maps where values differ, so lab samples go only where needed."
  - name: "Potassium"
    note: "Mapped alongside phosphorus."
  - name: "Total organic carbon"
    note: "Long-term soil health baseline."

quote:
  text: "I tell them [workers] to put a little extra fertilizer if there's a bad patch … nothing is really measured."
  who: "Drew, soybean farmer, North Carolina"

# Skills this project shows off (chips in "My part")
skills: ["SolidWorks CAD", "Modular product design", "Design for field use", "Plant & soil science", "Sensor selection", "Customer discovery", "Team founding"]
