# PROFILE — bio, education, awards.
#
# The bio is a list of blocks. Each block is one idea, laid out beside its own
# panel; blocks alternate sides down the page.
#   text:  Markdown. **bold**, *italics*, [links](https://...) all work.
#          For a coloured term use <b class="t-NAME">…</b> — the names are
#          delivery (teal), design (gold), research (violet), bio (green).
#   lead:  true to set this block in the larger opening type.
#   aside: what goes in the panel beside it —
#            waver        the stick figure
#            bioscaffold  the Kyriakides Lab scene
#            interests    music / soccer / taekwondo switcher
#            galantamine  the daffodil → galantamine animation (plays itself)
#            quote        a pull quote, set in `note:`
#          leave it out for a full-width block.
#   side:  right or left to pin the panel to that side; otherwise blocks
#          alternate down the page.
#   note:  the pull quote, when aside is `quote`.
#   dialogue: a list of quoted lines. They fade in and float up one after
#          another beside the block's text, with `cite:` under them.
#          Each line needs SIX spaces before its dash, deeper than the
#          `dialogue:` key above it — YAML will not parse otherwise:
#              - dialogue:
#                  - "first line"
#                  - "second line"
#   class: film  to set the block as the closing quote block.

bio:
  - lead: true
    aside: waver
    text: |
      Hi! My name is **Yuvin**, a biomedical engineering student at **Yale**, originally from Duluth, Georgia.

  - aside: bioscaffold
    text: |
      I work in the **Kyriakides Lab** on optimizing ECM bioscaffold integration with host tissue in diabetic and burn wounds. Previously in the **Ng Lab** at University College Dublin on biolistic gene delivery.

  - aside: interests
    text: |
      I also love to play music in various chamber groups, composition ensembles, and the **Yale Symphony Orchestra**. I like to explore sports too — Yale's club soccer first team, Social Chair for **Yale Taekwondo**, and basketball with friends.

  - aside: galantamine
    side: right
    text: |
      Intellectually, I love thinking about <b class="t-bio">evolutionary biology</b> — how crazy it is for us to be here, how genes evolved, how cellular machinery this advanced could self-evolve. More importantly, this informs how we think about society, medicine, and collective subconcious. One of my favourite facts: we crave sugars and carbs today because those resources were seasonally scarce in our ancestral environment.

      I hope to innovate in **biomedical engineering** across <b class="t-delivery">drug delivery</b>, <b class="t-design">product design</b> and <b class="t-research">research technology</b>, and I envision a future of medicine based in nature. In the **Ng Lab** I worked on bringing <b class="t-bio">galantamine</b>, a moderate Alzheimer's therapeutic, into viable cell-culture manufacturing — Galantamine is produced naturally in daffodil glandular trichomes, just one example of how nature holds our therapeutic secrets, just waiting to be discovered!

  - aside: quote
    note: "If nature can make us, it can repair us."
    text: |
      From using native **T and B cells** to deliver therapeutics, letting the body iterate its own adaptive cancer therapy, to creating the conditions for better orthopedic healing through medical products — **my curiosity for evolution, biology and its intersection with engineering drives everything I do.**

  - dialogue:
      - "AO: When you reattach a severed nerve, is it you who heals it back together or the body?"
      - "DS: "It's the cells."
      - "AO: And cells are only programmed to put themselves back together in very specific ways. What if I told you that your own body could be convinced to put itself back together in all sorts of ways?"
      - "AO: I know how to reorient the spirit to better heal the body."
    cite: "Doctor Strange (2016)"
    class: film
    text: |
      This is my favourite quote from one of my favourite movies: not just fiction, I hope medicine never grows to be synthetic or artificial. I hope it roots itself in where we come from, where we exist, and where we will return.

