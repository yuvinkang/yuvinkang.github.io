# The bio is plain text: leave a blank line between paragraphs. **bold**, *italics* and [links](https://...) work.
bio: |
  I'm a biomedical engineering student at Yale, from Duluth, Georgia. My work sits where tissue engineering, plant biotechnology, and hardware meet.

  Right now I'm in the **Kyriakides Lab**, studying how ECM bioscaffolds integrate with host tissue in diabetic and burn wounds. Before that, I optimized biolistic gene delivery in the **Ng Lab** at University College Dublin. I also co-founded **Prairi Robotics**, an autonomous rover for plant and soil health.

  Outside the lab I'm principal bassist of the Yale Symphony Orchestra, and I play club soccer and train in taekwondo.

