# PROFILE — bio, education, awards.
# The bio is plain text: leave a blank line between paragraphs. **bold**, *italics* and [links](https://...) work.
bio: |
  Hi! My name is Yuvin, a biomedical engineering student at Yale, originally from Duluth, Georgia.

  I work in the **Kyriakides Lab** working on optimizing ECM bioscaffold integration with host tissue in diabetic and burn wounds. Previously in the **Ng Lab** at University College Dublin on biolistic gene delivery.

  I also love to play music in various chamber groups, composition ensembles, and the Yale Symphony Orchestra! I also like to explore sports, playing on Yale's club soccer first team, Social Chair for Yale Taekwondo, and basketball with friends!

  Intellectually, I love thinking about evolutionary biology - how crazy it is for us to be here, how genes evolved, how cellular machinery so advanced could self-evolve. (One of my favorite facts is how the reason we crave sugars/carbohydrates like candy and burgers is because of the seasonal scarcity of these essential resources in our ancestral times)

  I hope to innovate in biomedical engineering in wide fields from drug delivery to product design to research technology to further explore what blows my mind. I envision a future of medicine based in nature - afterall, if it can make us, it can repair us. (For Example, in the **Ng Lab**, I worked on bringing galantamine, a moderate alzeimer's therapeutic into viable cell culture manufacturing. Galantamine is produced naturally in daffodil glandular trichomes! (Nature Rocks!)
  
  From using native T and B cells to deliver therapeutics, enabling the body to iterate its own adaptive cancer therapy, or simply creating conditions for better orthopedic healing through medical products, my curiosity for evolution, biology, and its intersection with engineering drives me in everything I do!

