# PROFILE — bio, education, awards.
# The bio is plain text: leave a blank line between paragraphs. **bold**, *italics* and [links](https://...) work.
bio: |
  Biomedical engineering student at Yale, from Duluth, Georgia.

  I work in the **Kyriakides Lab** on how ECM bioscaffolds integrate with host tissue in diabetic and burn wounds. Previously in the **Ng Lab** at University College Dublin on biolistic gene delivery. I co-founded **Prari Robotics**, an autonomous rover for soil and plant health.

  Principal bassist of the Yale Symphony Orchestra. Club soccer and taekwondo.

