---
layout: default
---
<article class="page post reveal">
  <p class="eyebrow"><a href="{{ '/blog/' | relative_url }}">← All posts</a><span>{{ page.date | date: "%Y.%m.%d" }}</span></p>
  <h1 class="page-title">{{ page.title }}</h1>
  {% if page.description %}<p class="lede">{{ page.description }}</p>{% endif %}
  <div class="prose">
    {{ content }}
  </div>
</article>
